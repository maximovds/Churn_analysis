[project]
name = "churn-analysis"
version = "0.1.0"
description = "Exploratory data analysis and churn prediction for a telecom customer dataset"
readme = "README.md"
authors = [
    { name = "Dmitry", email = "dmitrym622@gmail.com" }
]
requires-python = ">=3.13.7"
dependencies = [
    "ipykernel>=7.4.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
